name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-exe:
    # PyInstaller can only build a Windows exe on Windows (no cross-compiling).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # bundled interpreter; matches the dev/CI baseline
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group build-exe
      - run: pyinstaller uwmirror.spec --noconfirm
      - name: Smoke-test the frozen bundle imports
        run: python -c "import PyInstaller; print('built', __import__('pathlib').Path('dist/uwmirror.exe').stat().st_size)"
      - uses: actions/upload-artifact@v4
        with:
          name: uwmirror-exe
          path: dist/uwmirror.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) — no API token secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish, build-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: uwmirror-exe
          path: dist/
      - name: Extract this version's changelog section
        run: |
          python - <<'EOF'
          import re, os
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(tag)}\].*?\n(.*?)(?=^## \[|\Z)", text, re.S | re.M
          )
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(
              match.group(1).strip() if match else f"Release {tag}."
          )
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
